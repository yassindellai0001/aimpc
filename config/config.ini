# ══════════════════════════════════════════════════════
# Free Fire Aimbot — Configuration
# ══════════════════════════════════════════════════════

[Capture]
# 0 = find game window automatically, 1 = primary monitor
monitor_mode = 0
# Process name (empty = auto-detect common emulators)
game_process = 
# Pixels of margin around the crosshair crop
crop_margin = 40
# Radius of the aim circle (pixels)
circle_radius = 150

[AI]
# ONNX model path (relative to this file, or absolute)
model = best.onnx
# Input size — must be a multiple of 32
input_size = 320
# yolov5 / yolov7 / yolov8 / yolov10 / yolov11
model_type = yolov8
# Number of classes (yolov10 always uses 1)
num_classes = 1
# Confidence threshold (0.0, 1.0]
confidence = 0.40
# NMS threshold (0.0, 1.0]
nms = 0.45
# 1 = try OpenCL, 0 = CPU only
use_gpu = 1

[Aim]
# Speed multiplier (0.01, 10]
aim_speed = 1.0
# Head aim offset (pixels)
head_offset_x = 0
head_offset_y = 0
# Velocity prediction multiplier (0 = off)
prediction = 1.0
# Fire only when within this distance (pixels)
fire_threshold = 8.0

[General]
# Reject unknown keys (true / false)
strict = false
