name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCV
        shell: pwsh
        run: |
          choco install opencv --version=4.13.0 -y --no-progress

      - name: Locate OpenCV
        shell: pwsh
        run: |
          $config = Get-ChildItem C:\tools\opencv -Recurse `
            -Filter OpenCVConfig.cmake |
            Where-Object {
              $_.FullName -match '\\x64\\vc17\\lib\\OpenCVConfig.cmake$'
            } | Select-Object -First 1

          if (-not $config) {
            $config = Get-ChildItem C:\tools\opencv `
              -Recurse -Filter OpenCVConfig.cmake |
              Where-Object {
                $_.FullName -match '\\build\\OpenCVConfig.cmake$'
              } | Select-Object -First 1
          }

          if (-not $config) {
            throw "OpenCVConfig.cmake not found"
          }

          $dir = $config.DirectoryName

          "OpenCV_DIR=$dir" >> $env:GITHUB_ENV

          Write-Host "OpenCV_DIR=$dir"
          Write-Host "Config: $($config.FullName)"

          Get-ChildItem C:\tools\opencv\build\x64 -Directory |
            Format-Table Name, FullName

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DOpenCV_DIR="$env:OpenCV_DIR"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release --parallel

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null

          Copy-Item build\Release\aimbot.exe stage\

          if (Test-Path build\Release\config.ini) {
            Copy-Item build\Release\config.ini stage\
          }

          if (Test-Path config\best.onnx) {
            Copy-Item config\best.onnx stage\
          }

          # Locate OpenCV runtime DLL
          $dlls = Get-ChildItem C:\tools\opencv\build\x64 `
            -Recurse -Filter "opencv_world*.dll" |
            Sort-Object FullName

          if (-not $dlls) {
            throw "OpenCV runtime DLL not found"
          }

          $dlls | Select-Object -First 1 |
            Copy-Item -Destination stage\

          Write-Host "OpenCV DLL: $($dlls[0].FullName)"

          Write-Host "Staged files:"
          Get-ChildItem stage | Format-Table

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimbot-windows-x64
          path: stage/
          if-no-files-found: error
